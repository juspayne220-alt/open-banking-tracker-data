<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Banking Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07090f;--surface:#0e1117;--surface2:#141720;--border:rgba(255,255,255,.07);--border-h:rgba(99,102,241,.6);--accent:#6366f1;--accent2:#8b5cf6;--accent3:#06b6d4;--text:#f1f5f9;--text2:#94a3b8;--text3:#475569;--green:#10b981;--r:14px}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.hero{position:relative;overflow:hidden;padding:52px 40px 44px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,#0e0f1a,#0d1024 60%,#0a0e1c)}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 10% 50%,rgba(99,102,241,.13) 0%,transparent 70%),radial-gradient(ellipse 40% 60% at 90% 20%,rgba(139,92,246,.1) 0%,transparent 70%);pointer-events:none}
.hero-inner{position:relative;max-width:1200px;margin:0 auto}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.25);padding:4px 12px;border-radius:999px;margin-bottom:18px}
.dot{width:6px;height:6px;border-radius:50%;background:#10b981;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hero h1{font-size:clamp(1.9rem,4vw,2.9rem);font-weight:800;letter-spacing:-.03em;background:linear-gradient(135deg,#fff 30%,#a5b4fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.15;margin-bottom:12px}
.hero p{font-size:.95rem;color:var(--text2);max-width:480px;line-height:1.65}
.stats-bar{display:flex;border-bottom:1px solid var(--border);background:var(--surface);overflow-x:auto}
.stat{flex:1;min-width:110px;padding:18px 24px;border-right:1px solid var(--border);text-align:center}
.stat:last-child{border-right:none}
.stat-num{font-size:1.55rem;font-weight:800;letter-spacing:-.03em;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-label{font-size:.7rem;color:var(--text3);font-weight:600;margin-top:2px;text-transform:uppercase;letter-spacing:.06em}
.toolbar{padding:20px 40px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:1280px;margin:0 auto}
.sw{position:relative;flex:1;min-width:200px;max-width:400px}
.si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.search{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px 10px 38px;color:var(--text);font-size:.88rem;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s}
.search::placeholder{color:var(--text3)}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fb{font-family:inherit;font-size:.78rem;font-weight:500;padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .18s}
.fb:hover{border-color:var(--accent);color:var(--text)}
.fb.active{background:var(--accent);border-color:var(--accent);color:#fff}
.rc{margin-left:auto;font-size:.78rem;color:var(--text3);white-space:nowrap}
.gw{max-width:1280px;margin:0 auto;padding:0 40px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:0;transition:opacity .2s}
.card:hover{border-color:var(--border-h);transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.4),0 0 0 1px rgba(99,102,241,.15)}
.card:hover::before{opacity:1}
.ch{display:flex;align-items:center;gap:12px}
.icon{width:42px;height:42px;border-radius:10px;object-fit:contain;background:var(--surface2);border:1px solid var(--border);display:block;flex-shrink:0}
.ifall{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;color:#fff;flex-shrink:0}
.cm{flex:1;min-width:0}
.ct{font-weight:700;font-size:.95rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cq{font-size:.73rem;color:var(--text3);margin-top:3px}
.cd{font-size:.79rem;color:var(--text2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:.68rem;padding:3px 9px;border-radius:999px;font-weight:600}
.tm{background:rgba(99,102,241,.12);color:#a5b4fc;border:1px solid rgba(99,102,241,.25)}
.tv{background:rgba(16,185,129,.1);color:#34d399;border:1px solid rgba(16,185,129,.25)}
.tr{background:rgba(6,182,212,.1);color:#67e8f9;border:1px solid rgba(6,182,212,.2)}
.tc{background:rgba(245,158,11,.1);color:#fbbf24;border:1px solid rgba(245,158,11,.2)}
.cf{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--border)}
.ci{font-size:.68rem;font-family:'SF Mono','Fira Code',monospace;color:var(--text3)}
.ca{color:var(--text3);transition:transform .2s,color .2s}
.card:hover .ca{color:var(--accent);transform:translateX(3px)}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:200;padding:24px;opacity:0;pointer-events:none;transition:opacity .2s}
.mb.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid rgba(255,255,255,.1);border-radius:20px;max-width:580px;width:100%;max-height:88vh;overflow-y:auto;position:relative;transform:scale(.96) translateY(12px);transition:transform .25s cubic-bezier(.34,1.56,.64,1);box-shadow:0 32px 80px rgba(0,0,0,.6)}
.mb.open .modal{transform:scale(1) translateY(0)}
.mban{height:6px;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3));border-radius:20px 20px 0 0}
.mi{padding:28px 32px 32px}
.mh{display:flex;gap:16px;align-items:flex-start;margin-bottom:20px}
.micon{width:52px;height:52px;border-radius:12px;object-fit:contain;background:var(--surface2);border:1px solid var(--border);flex-shrink:0}
.mifall{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;color:#fff;flex-shrink:0}
.mtw{flex:1}
.mtitle{font-size:1.25rem;font-weight:800;letter-spacing:-.02em;color:var(--text)}
.mid{font-size:.72rem;font-family:'SF Mono','Fira Code',monospace;color:var(--text3);margin-top:4px}
.cbtn{margin-left:auto;background:var(--surface2);border:1px solid var(--border);color:var(--text2);width:32px;height:32px;border-radius:8px;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,color .15s}
.cbtn:hover{background:#1e2030;color:var(--text)}
.mdesc{font-size:.85rem;color:var(--text2);line-height:1.7;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.stitle{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:12px}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.ii{background:var(--surface2);border-radius:10px;padding:12px 14px}
.il{font-size:.68rem;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.iv{font-size:.85rem;color:var(--text);font-weight:500;word-break:break-all}
.iv a{color:#a5b4fc;text-decoration:none}
.iv a:hover{text-decoration:underline}
.iv.mono{font-family:'SF Mono','Fira Code',monospace;font-size:.78rem;color:var(--accent)}
.mbox{background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.2);border-radius:12px;padding:16px;margin-bottom:20px}
.mbox .stitle{color:#a5b4fc}
.mr{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;padding:4px 0}
.mk{color:var(--text3)}
.mv{color:var(--text);font-weight:500;text-align:right}
.mt{margin-top:10px}
.mtag{display:inline-block;font-size:.68rem;background:rgba(99,102,241,.1);color:#c7d2fe;border:1px solid rgba(99,102,241,.2);border-radius:6px;padding:2px 8px;margin:3px 3px 0 0}
.cpills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:20px}
.cp{font-size:.72rem;padding:3px 9px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text2);font-weight:500}
.mnote{background:var(--surface2);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:14px 16px;font-size:.79rem;color:var(--text2);line-height:1.7;margin-top:4px}
.nr{grid-column:1/-1;text-align:center;padding:80px 0;color:var(--text3)}
.nr .nb{font-size:2.5rem;margin-bottom:12px}
@media(max-width:600px){.hero{padding:36px 20px 32px}.toolbar{padding:16px 20px}.gw{padding:0 20px 40px}.ig{grid-template-columns:1fr}.mi{padding:20px}.stats-bar{display:none}}
</style>
</head>

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function iconH(a,s){s=s||42;if(a.iconUrl)return '<img class="icon" width="'+s+'" height="'+s+'" src="'+esc(a.iconUrl)+'" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'" alt="" loading="lazy"><div class="ifall" style="width:'+s+'px;height:'+s+'px;display:none">'+esc((a.label||'?')[0])+'</div>';return '<div class="ifall" style="width:'+s+'px;height:'+s+'px">'+esc((a.label||'?')[0])+'</div>'}
function cardH(a){const lc=a.marketCoverage&&a.marketCoverage.live&&a.marketCoverage.live.length;const tags=(a.mcpServer?'<span class="tag tm">&#9889; MCP</span>':'')+(a.verified?'<span class="tag tv">&#10003; Verified</span>':'')+(a.marketFocus?'<span class="tag tr">'+esc(a.marketFocus)+'</span>':'')+(lc?'<span class="tag tc">'+lc+' markets</span>':'');return '<div class="card" onclick="show(\''+esc(a.id)+'\')">'+'<div class="ch"><div>'+iconH(a,42)+'</div><div class="cm"><div class="ct">'+esc(a.label)+'</div><div class="cq">'+flag(a.countryHQ)+' '+esc(a.countryHQ||'')+'</div></div></div>'+(a.description?'<div class="cd">'+esc(a.description)+'</div>':'<div class="cd" style="color:var(--text3);font-style:italic">No description</div>')+(tags?'<div class="tags">'+tags+'</div>':'')+'<div class="cf"><span class="ci">'+esc(a.id)+'</span><span class="ca">&#8594;</span></div></div>'}
function render(list){document.getElementById('rc').textContent=list.length+' of '+DATA.length;document.getElementById('grid').innerHTML=list.length?list.map(cardH).join(''):'<div class="nr"><div class="nb">&#128269;</div><p>No results found</p></div>'}
function applyF(){const q=document.getElementById('search').value.toLowerCase();let l=DATA;if(activeF==='mcp')l=l.filter(a=>a.mcpServer);if(activeF==='verified')l=l.filter(a=>a.verified);if(q)l=l.filter(a=>(a.label||'').toLowerCase().includes(q)||(a.description||'').toLowerCase().includes(q)||(a.marketFocus||'').toLowerCase().includes(q)||(a.countryHQ||'').toLowerCase().includes(q)||(a.id||'').toLowerCase().includes(q));render(l)}
document.getElementById('search').addEventListener('input',applyF);
document.querySelectorAll('.fb').forEach(b=>b.addEventListener('click',function(){document.querySelectorAll('.fb').forEach(x=>x.classList.remove('active'));this.classList.add('active');activeF=this.dataset.f;applyF()}));
function show(id){const a=DATA.find(x=>x.id===id);if(!a)return;const info=[['HQ',flag(a.countryHQ)+' '+esc(a.countryHQ||'&mdash;')],['ID','<span class="mono">'+esc(a.id)+'</span>'],['Website',a.website?'<a href="'+esc(a.website)+'" target="_blank" rel="noopener">Visit &#8594;</a>':'&mdash;'],['Dev Portal',a.developerPortalUrl?'<a href="'+esc(a.developerPortalUrl)+'" target="_blank" rel="noopener">Docs &#8594;</a>':'&mdash;'],['Status',a.statusUrl?'<a href="'+esc(a.statusUrl)+'" target="_blank" rel="noopener">Status &#8594;</a>':'&mdash;'],['Twitter',a.twitter?'<a href="https://twitter.com/'+esc(a.twitter)+'" target="_blank" rel="noopener">@'+esc(a.twitter)+'</a>':'&mdash;'],['Verified',a.verified?'<span style="color:var(--green)">&#10003; Yes</span>':'<span style="color:var(--text3)">&mdash;</span>'],['Market',esc(a.marketFocus||'&mdash;')]];let mcp='';if(a.mcpServer){const m=a.mcpServer;const rows=[['Type',m.type],['Transport',m.transport],['Auth',m.authType],['Package',m.npmPackage],['Command',m.command]].filter(([,v])=>v).map(([k,v])=>'<div class="mr"><span class="mk">'+esc(k)+'</span><span class="mv">'+esc(v)+'</span></div>').join('');const tools=m.tools&&m.tools.length?'<div class="mt">'+m.tools.map(t=>'<span class="mtag">'+esc(t)+'</span>').join('')+'</div>':'';const repo=m.repositoryUrl?'<div class="mr"><span class="mk">Repo</span><span class="mv"><a href="'+esc(m.repositoryUrl)+'" target="_blank" rel="noopener" style="color:#a5b4fc">View &#8594;</a></span></div>':'';const doc=m.documentationUrl?'<div class="mr"><span class="mk">Docs</span><span class="mv"><a href="'+esc(m.documentationUrl)+'" target="_blank" rel="noopener" style="color:#a5b4fc">View &#8594;</a></span></div>':'';mcp='<div class="mbox"><div class="stitle">&#9889; MCP Server</div>'+rows+repo+doc+tools+'</div>'}let cov='';if(a.marketCoverage&&a.marketCoverage.live&&a.marketCoverage.live.length){cov='<div class="stitle">Market Coverage ('+a.marketCoverage.live.length+' live)</div><div class="cpills">'+a.marketCoverage.live.map(c=>'<span class="cp">'+flag(c)+' '+esc(c)+'</span>').join('')+'</div>'}document.getElementById('mi').innerHTML='<div class="mh">'+iconH(a,52)+'<div class="mtw"><div class="mtitle">'+esc(a.label)+'</div><div class="mid">'+esc(a.id)+'</div></div><button class="cbtn" onclick="closeM()" aria-label="Close">&#10005;</button></div>'+(a.description?'<div class="mdesc">'+esc(a.description)+'</div>':'')+'<div class="stitle">Details</div><div class="ig">'+info.map(([l,v])=>'<div class="ii"><div class="il">'+esc(l)+'</div><div class="iv">'+v+'</div></div>').join('')+'</div>'+mcp+cov+(a.note?'<div class="stitle">Note</div><div class="mnote">'+esc(a.note)+'</div>':'');document.getElementById('mb').classList.add('open');document.getElementById('modal').scrollTop=0}
function closeM(){document.getElementById('mb').classList.remove('open')}
document.getElementById('mb').addEventListener('click',e=>{if(e.target===document.getElementById('mb'))closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
const countries=new Set();DATA.forEach(a=>{if(a.marketCoverage&&a.marketCoverage.live)a.marketCoverage.live.forEach(c=>countries.add(c));if(a.countryHQ)countries.add(a.countryHQ)});
document.getElementById('sMcp').textContent=DATA.filter(a=>a.mcpServer).length;
document.getElementById('sVer').textContent=DATA.filter(a=>a.verified).length;
document.getElementById('sCou').textContent=countries.size;
applyF();
</script>
</body>
</html>
